<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sage &amp; Steel share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&display=block">
<script src="../art.js"></script>
<style>
/* The link preview image (preview.png). Screenshot this page at 1200 x 630. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#F7F1E8}
body{font-family:"DM Sans",Arial,sans-serif;color:#26302B;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:600px 1fr;align-items:center;padding:0 0 0 72px;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;z-index:-1;right:-120px;top:-160px;width:640px;height:640px;border-radius:50%;background:#E2E9DA}
.brand{display:flex;align-items:center;gap:12px;font:600 30px/1 Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 0}
.brand em{font-style:italic;font-weight:400;color:#B4694B}
.brand svg{width:48px;height:48px}
h1{margin-top:34px;font-family:Fraunces,Georgia,serif;font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:500;font-size:104px;line-height:.93;letter-spacing:-.037em}
h1 span{display:block}
h1 em{font-style:italic;font-weight:400;color:#4A5E44}
p{margin-top:26px;font-size:24px;line-height:1.45;color:#47534C;max-width:470px}
.url{display:inline-block;margin-top:26px;padding:12px 20px;border-radius:999px;background:#26302B;color:#F7F1E8;font:600 19px/1 "DM Sans",Arial,sans-serif}
#tote{display:grid;place-items:center;height:630px}
.tote{width:476px;height:auto;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.6" fill="#E2E9DA" stroke="#26302B" stroke-width="2.4"/><circle cx="20" cy="20" r="14" fill="none" stroke="#26302B" stroke-width="1" opacity=".22"/><path d="M20 31V12" stroke="#4A5E44" stroke-width="1.8" stroke-linecap="round"/><path d="M20 25.5c-4.6-.6-7.4-3.6-7.6-7.8 4.4.3 7.2 3.2 7.6 7.8z" fill="#94A88A"/><path d="M20 20.5c4.6-.6 7.4-3.6 7.6-7.8-4.4.3-7.2 3.2-7.6 7.8z" fill="#5F7457"/><path d="M20 13.4c-1.9-1.5-2.6-3.6-2-6 2.2.8 3.2 3 2 6z" fill="#94A88A"/></svg><span>Sage <em>&amp;</em> Steel</span></div>
    <h1><span>Soft life.</span><span><em>Strong body.</em></span></h1>
    <p>Coach-picked gear and free guides for women who lift, walk and stretch.</p>
    <span class="url">sageandsteel.github.io</span>
  </div>
  <div id="tote"></div>
</div>
<script>document.getElementById("tote").innerHTML = SS.tote({ interactive: false });</script>
</body>
</html>
